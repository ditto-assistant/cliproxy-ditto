# Move to .github/workflows/ci.yml (pushing it needs a token with the workflow scope).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux amd64 and Apple Silicon: the end-to-end test loads the plugin
        # into the matching CLIProxyAPI release on each.
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The CLIProxyAPI release the e2e test loads is built with this Go;
          # a c-shared plugin has to match it.
          go-version: "1.26.10"
      - run: go vet ./...
      - run: go test -count=1 -v ./...
      - run: bash test/e2e/run.sh
      - run: bash test/e2e/classifier.sh
      - run: python3 -I -m unittest discover -s test -p 'classifier_safe_test.py'
